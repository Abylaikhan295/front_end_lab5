<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader Profile Manager</title>
    <script src="main.js" defer></script>
</head>
<body>
    <div>
        <form onsubmit="event.preventDefault();">
            <div>
                <label for="fullName">Reader Name</label>
                <br>
                <input id="fullName" type="text">
            </div>
            <div>
                <label for="birthYear">Birth Year</label>
                <br>
                <input id="birthYear" type="number">
            </div>
            <button id="submit">Save Reader</button>
        </form>
    </div>

    <div>
        <ul id="bookList">
            <li>Abai Zholy</li>
            <li>1984</li>
            <li>The Little Prince</li>
        </ul>
        <div>
            <button id="removeBookBtn">Remove Last Book</button>
            <div>
                <input id="bookInput" type="text" placeholder="Enter book title">
                <button id="addBookBtn">Add Book</button>
            </div>
        </div>
    </div>
</body>
</html>
