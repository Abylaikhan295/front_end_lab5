<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment_4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light p-4">

    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 800px;">
    <h3>Part 1</h3>
    <form style="margin-bottom: 40px;">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
<hr>
    
    <h3>Part 2</h3>
    <form class="mb-4 needs-validation" novalidate>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" placeholder="Your name" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Name is required.</div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="test@mail.com" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Email is required.</div>
            </div>
            <div class="col-12">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="2" required></textarea>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Message is required.</div>
                <div class="form-text">We won't share your data.</div>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </div>
    </form>
    <hr class="my-4">
    
    <h3>Part 3</h3>
    <form class="needs-validation" novalidate>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input type="text" id="firstName" class="form-control" required>
                <div class="invalid-feedback">Required field</div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Last Name</label>
                <input type="text" id="lastName" class="form-control" required>
                <div class="invalid-feedback">Required field</div>
            </div>
            <div class="col-12">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required>
                <div class="invalid-feedback">Invalid email</div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" minlength="6" required>
                <div class="invalid-feedback">Min 6 chars</div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" minlength="6" required>
                <div class="invalid-feedback">Must match</div>
            </div>
            <div class="col-md-6">
                <label class="form-label d-block">Gender</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="m" required>
                    <label class="form-check-label">Male</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="f" required>
                    <label class="form-check-label">Female</label>
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label d-block">Hobbies</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" value="reading">
                    <label class="form-check-label">Reading</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" value="sports">
                    <label class="form-check-label">Sports</label>
                </div>
            </div>
            <div class="col-12">
                <label class="form-label">Country</label>
                <select class="form-select" required>
                    <option selected disabled value="">Choose...</option>
                    <option value="KZ">Kazakhstan</option>
                    <option value="US">USA</option>
                    <option value="UK">UK</option>
                    <option value="KR">South Korea</option>
                    <option value="JP">Japan</option>
                    <option value="SG">Singapore</option>
                </select>
                <div class="invalid-feedback">Select country</div>
            </div>
            <div class="col-12 mt-3">
                <button type="submit" class="btn btn-primary">Submit</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
        </div>
    </form>
    </div>

    <script>
        const forms = document.querySelectorAll('.needs-validation');

        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                const password = document.getElementById('password');
                const confirmPassword = document.getElementById('confirmPassword');

                if (password && confirmPassword && password.value !== confirmPassword.value) {
                    confirmPassword.setCustomValidity("Passwords must match");
                } else if (confirmPassword) {
                    confirmPassword.setCustomValidity("");
                }

                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                form.classList.add('was-validated');
            }, false);
        });
    </script>
</body>
</html>
